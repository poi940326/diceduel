    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;

      font-family: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.75;

    p { margin: 0 0 18px; color: var(--ink-dim); }
    a.btn {
      display: inline-block; padding: 14px 26px; border-radius: 3px; text-decoration: none; font-weight: 700;
      color: #121417; background: var(--gold);
    }
    .url { display: block; margin-top: 14px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--ink-dim); word-break: break-all; }
