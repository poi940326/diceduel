<!-- 0.5 운영 종료(2026-10-15) 동안 내려받기 페이지 자리에 서는 페이지 — python Tools/publish_site.py --closed.
     정본 내려받기 페이지는 Site/index.html 이고, 다시 열 때는 그것을 python Tools/publish_site.py 로 올린다. -->
<style>
  :root { --bg: #14161c; --panel: #1d2029; --ink: #e9e6df; --dim: #9a9aa4; --line: #2c303b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  main {
    width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 40px 28px; text-align: center;
  }
  h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: 0.02em; }
  .sub { margin: 0 0 28px; color: var(--dim); font-size: 14px; }
  p { margin: 0; font-size: 17px; line-height: 1.7; }
  footer { margin-top: 28px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Dice Duel</h1>
  <div class="sub">다이스 듀얼</div>
  <p>새 버전으로 개선 중입니다.<br>지금은 내려받을 수 없습니다.</p>
  <footer>Dice Duel</footer>
</main>
</body>
